[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "cd /app && pnpm --filter @reporthub/backend db:generate",
  "cd /app && pnpm --filter @reporthub/backend build"
]

[start]
cmd = "cd /app && node apps/backend/dist/index.js"
