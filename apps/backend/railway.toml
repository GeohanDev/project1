[build]
builder = "nixpacks"
buildCommand = "pnpm --filter @reporthub/backend db:generate && pnpm --filter @reporthub/backend build"

[deploy]
startCommand = "node apps/backend/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[deploy.envVars]]
name = "NODE_ENV"
value = "production"
