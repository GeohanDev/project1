[build]
builder = "nixpacks"
buildCommand = "pnpm --filter @reporthub/shared build && pnpm --filter @reporthub/backend db:generate && pnpm --filter @reporthub/backend build"

[deploy]
startCommand = "sh /app/apps/backend/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[deploy.envVars]]
name = "NODE_ENV"
value = "production"

[[deploy.envVars]]
name = "TZ"
value = "Asia/Kuala_Lumpur"
