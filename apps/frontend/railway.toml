[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @reporthub/backend db:generate && pnpm build"

[deploy]
startCommand = "pnpm --filter @reporthub/frontend start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[deploy.envVars]]
name = "NODE_ENV"
value = "production"
